<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!--PWA-->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ORBIT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<!--/PWA-->
<title>ORBIT 居合</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho+B1:wght@500;700&display=swap">
<style>
/* Layout: the world fills the screen. Upper half = brush numerals over the night sky, a katana as the charge gauge, bamboo stalks as rounds.
   Lower half = the samurai; a dark ink strip at the bottom holds the controls. Work charges the blade; zero is one draw-cut. */
@property --p  { syntax: "<color>"; inherits: true; initial-value: #c8102e; }
:root{
  --ink:#08070a; --ink2:#131118; --paper:#f3ede3; --mist:#a7a2a6; --line:rgba(243,237,227,.16);
  --crimson:#c8102e; --ember:#ff5a3c; --gold:#f2d38c; --steel:#c9d4e6; --moon:#8fa9d6;
  --font-brush:"Yuji Syuku","Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-ui:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --U:min(100vw, 58vh, 560px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;box-sizing:border-box;background:var(--ink)}
body{height:100%;margin:0;background:var(--ink);color:var(--paper);font-family:var(--font-ui);overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* world layers (fixed, edge to edge) */
.world{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(70% 40% at 50% 28%, #3a3640, #0b0a0e 70%)}
.scene{position:absolute;inset:-4%;background-size:cover;background-position:center 62%;opacity:0;transition:opacity 1.1s ease, transform 1.2s ease, filter 1.2s ease;transform:scale(1)}
.scene.on{opacity:1}
.scene.fast{transition:opacity .08s linear}
#app[data-phase="work"] .scene[data-s="kamae"].on{transform:scale(calc(1 + var(--charge,0) * .07))}
#app[data-phase="prep"] .scene.on,#app[data-phase="idle"] .scene.on{filter:brightness(.78) saturate(.85)}
.shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(6,5,8,.78) 0%, rgba(6,5,8,.5) 30%, rgba(6,5,8,0) 52%, rgba(6,5,8,0) 70%, rgba(6,5,8,.86) 100%)}
.vignette{position:absolute;inset:0;pointer-events:none;opacity:calc(.35 + var(--tension,0) * .6);transition:opacity .4s;
  background:radial-gradient(ellipse at 50% 55%, transparent 40%, rgba(70,0,8,.85) 100%)}
#leaves{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
/* the light line follows the cut in the chosen strike picture: --rot (and --rot2 for the cross cut) */
.slash{position:absolute;left:50%;top:47%;width:170vmax;margin-left:-85vmax;height:3px;pointer-events:none;opacity:0;transform-origin:center;
  transform:rotate(var(--rot,-9deg)) scaleX(0);background:linear-gradient(90deg, transparent, #fff 25%, #fff6d8 70%, transparent);
  box-shadow:0 0 18px 6px rgba(255,240,200,.85), 0 0 60px 18px rgba(255,90,60,.45)}
.slash2{transform:rotate(var(--rot2,-9deg)) scaleX(0)}
#app.strike .flash{animation:flash .55s ease-out}
#app.strike .slash{animation:slash .9s cubic-bezier(.15,.9,.2,1)}
#app.strike.double .slash2{animation:slash2 .9s .14s cubic-bezier(.15,.9,.2,1) both}
#app.strike{animation:quake .45s linear}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
@keyframes slash{0%{opacity:1;transform:rotate(var(--rot)) scaleX(0)}18%{opacity:1;transform:rotate(var(--rot)) scaleX(1)}100%{opacity:0;transform:rotate(var(--rot)) scaleX(1) scaleY(.2)}}
@keyframes slash2{0%{opacity:1;transform:rotate(var(--rot2)) scaleX(0)}18%{opacity:1;transform:rotate(var(--rot2)) scaleX(1)}100%{opacity:0;transform:rotate(var(--rot2)) scaleX(1) scaleY(.2)}}
@keyframes quake{0%,100%{transform:none}20%{transform:translate(-7px,4px)}40%{transform:translate(6px,-5px)}60%{transform:translate(-4px,3px)}80%{transform:translate(2px,-2px)}}
#app.tense{animation:tremble .18s linear infinite}
@keyframes tremble{0%,100%{transform:none}25%{transform:translate(calc(var(--tension) * 1.6px),calc(var(--tension) * -1px))}75%{transform:translate(calc(var(--tension) * -1.4px),calc(var(--tension) * 1.2px))}}

/* app */
#app{--p:var(--crimson);transition:--p .8s ease;position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:4px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}
#app[data-phase="rest"]{--p:var(--moon)}
#app[data-phase="prep"],#app[data-phase="done"]{--p:var(--gold)}
#app[data-phase="idle"]{--p:var(--gold)}

.top{display:grid;gap:8px}
.bar{display:flex;align-items:center;justify-content:space-between}
.brand{font:500 12px/1 var(--font-ui);letter-spacing:.5em;color:var(--mist)}
.brand b{color:var(--paper);font-weight:700}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(8,7,10,.45);display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.icon-btn svg{width:19px;height:19px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 12px;border:0;border-bottom:1.5px solid transparent;background:none;color:var(--mist);font-weight:500;font-size:13px;letter-spacing:.08em;transition:color .3s,border-color .3s}
.tab[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--p)}

.main{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:min(3vh,24px);gap:min(1.4vh,12px);cursor:pointer;transition:opacity .35s}
#app.strike .main{opacity:0}
.phase{font:700 15px/1.2 var(--font-ui);letter-spacing:.42em;padding-left:.42em;color:var(--paper);display:flex;align-items:center;gap:12px;max-width:100%}
.phase .kanji{font:400 22px/1 var(--font-brush);letter-spacing:0;padding:0;color:var(--p);text-shadow:0 0 12px color-mix(in srgb,var(--p) 60%,transparent)}
.phase .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phase.long .tx{letter-spacing:.08em}
.cap{font-size:12px;font-weight:700;letter-spacing:.4em;padding-left:.4em;color:var(--gold);text-shadow:0 1px 8px #000;margin-bottom:-.4em}
.cap:empty{display:none}
.time{font-family:var(--font-brush);font-weight:400;line-height:.86;font-size:calc(var(--U) * var(--k,.5));display:flex;align-items:flex-end;color:var(--paper);
  text-shadow:.035em .035em 0 color-mix(in srgb,var(--crimson) 85%,transparent), 0 0 .02em #000, 0 .06em .35em rgba(0,0,0,.85)}
#app[data-phase="rest"] .time{text-shadow:.03em .03em 0 rgba(60,90,150,.7), 0 .06em .35em rgba(0,0,0,.85)}
.time .d{display:inline-block;width:.62em;text-align:center}
.time .c{display:inline-block;width:.3em;text-align:center;transform:translateY(-.08em)}
.time .t{font-size:.36em;width:1.1em;text-align:left;padding-bottom:.1em;color:var(--mist)}
.time.beat{animation:beat .7s cubic-bezier(.2,.8,.2,1)}
@keyframes beat{0%{transform:scale(1.14)}100%{transform:scale(1)}}
.sub,.next{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:3px 12px;border-radius:999px;background:rgba(8,7,10,.5);
  text-shadow:0 0 4px #000,0 1px 8px #000;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sub{font-size:14px;font-weight:500;letter-spacing:.16em;color:var(--paper)}
.next{font-size:12.5px;letter-spacing:.12em;color:#d9d3cc}
.sub:empty,.next:empty{display:none}

/* katana gauge: hilt on the left, light runs to the tip */
.katana{position:relative;width:min(88vw,440px);height:18px;display:flex;align-items:center;filter:drop-shadow(0 2px 6px rgba(0,0,0,.8))}
.tsuka{width:22%;height:9px;border-radius:2px;background:repeating-linear-gradient(60deg,#1a1418 0 4px,#5a1220 4px 7px),#1a1418;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.tsuba{width:7px;height:18px;border-radius:3px;background:linear-gradient(#5b4a2c,#2a2116);margin-inline:2px}
.blade{position:relative;flex:1;height:5px;clip-path:polygon(0 0,94% 0,100% 100%,0 100%);background:linear-gradient(180deg,#e9eef5,#8d97a6 55%,#59606c)}
.blade i{position:absolute;inset:0;width:calc(var(--fill,0) * 100%);background:linear-gradient(90deg, color-mix(in srgb,var(--p) 70%,#fff), #fff 85%);box-shadow:0 0 12px 3px color-mix(in srgb,var(--p) 70%,transparent);transition:width .25s linear}
.katana::after{content:"";position:absolute;right:0;top:50%;width:calc(var(--fill,0) * 26px);height:calc(var(--fill,0) * 26px);transform:translate(40%,-50%);border-radius:50%;
  background:radial-gradient(circle,#fff 0,color-mix(in srgb,var(--p) 60%,transparent) 40%,transparent 70%);opacity:calc(var(--tension,0) * 1.2)}

/* bamboo = rounds */
.grove{display:flex;align-items:flex-end;justify-content:center;gap:var(--g,8px);height:38px;max-width:100%}
.bamboo{position:relative;width:var(--w,10px);height:34px;border-radius:2px 2px 1px 1px;
  background:repeating-linear-gradient(180deg,transparent 0 10px,rgba(30,36,20,.75) 10px 11.5px),linear-gradient(90deg,#4a5436,#a8b283 45%,#5c6744);
  box-shadow:0 2px 4px rgba(0,0,0,.6);transition:height .5s cubic-bezier(.2,.8,.2,1)}
.bamboo.cut{height:20px;clip-path:polygon(0 30%,100% 0,100% 100%,0 100%);background:linear-gradient(170deg,#efe6c8 0 18%,transparent 18%),repeating-linear-gradient(180deg,transparent 0 10px,rgba(30,36,20,.75) 10px 11.5px),linear-gradient(90deg,#4a5436,#a8b283 45%,#5c6744)}
.bamboo.cur::after{content:"";position:absolute;left:50%;top:-10px;width:18px;height:18px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,#fff,color-mix(in srgb,var(--p) 70%,transparent) 45%,transparent 70%);animation:glint 1.4s ease-in-out infinite}
@keyframes glint{0%,100%{opacity:.25;transform:translateX(-50%) scale(.6)}50%{opacity:1;transform:translateX(-50%) scale(1.1)}}

.laps{display:grid;gap:4px;width:min(100%,300px);font:500 14px var(--font-ui);color:var(--mist);text-shadow:0 1px 6px #000}
.laps div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-block:3px}
.laps div:first-child{color:var(--paper)}

/* controls on an ink strip */
.foot{display:grid;gap:10px;padding-top:12px;position:relative}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;justify-items:center}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;font-size:11.5px;font-weight:500;letter-spacing:.14em;color:var(--mist);min-width:0;text-shadow:0 1px 6px #000}
.ctl .b{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:rgba(8,7,10,.55);border:1px solid rgba(243,237,227,.5);color:var(--paper);transition:transform .15s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ctl .b svg{width:22px;height:22px}
.ctl .b .tx{font:700 17px var(--font-ui)}
.ctl.main{color:var(--paper)}
.ctl.main .b{width:86px;height:86px;border:2px solid var(--p);box-shadow:0 0 0 5px rgba(8,7,10,.5), 0 0 26px color-mix(in srgb,var(--p) 55%,transparent), inset 0 0 18px color-mix(in srgb,var(--p) 30%,transparent)}
.ctl.main .b svg{width:32px;height:32px}
.ctl:active .b{transform:scale(.93)}
.ctl:disabled{opacity:.3;cursor:default}
.presets{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px;min-height:36px}
.presets::-webkit-scrollbar{display:none}
.presets.off{visibility:hidden}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:rgba(8,7,10,.55);border:1px solid var(--line);font-size:12.5px;font-weight:500;letter-spacing:.06em;white-space:nowrap;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.chip.on{border-color:var(--p);color:var(--gold)}
.chip.done{opacity:.5;text-decoration:line-through;text-decoration-color:rgba(243,237,227,.5)}
.chip.on.done{opacity:.8}
.menu-item{display:grid;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
.menu-item .row{display:flex;align-items:center;gap:8px}
.menu-item input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--ink);color:var(--paper);padding-inline:12px;font:500 15px var(--font-ui)}
.menu-item .nums{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between}
.menu-item .num{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mist)}
.menu-item .stepper output{min-width:62px;font-size:15px}
.menu-item .stepper button{width:40px;height:40px}
.menu-item .prog{font-size:11px;color:var(--mist)}
.row-save{display:grid;gap:8px}
.row-save input{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--ink);color:var(--paper);padding-inline:12px;font:500 15px var(--font-ui)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(2,2,4,.6);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:86%;overflow-y:auto;overscroll-behavior:contain;
  background:var(--ink2);border-top:1px solid var(--line);border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(24px + env(safe-area-inset-bottom,0px));
  -webkit-user-select:auto;user-select:auto}
.sheet.open{transform:none}
.sheet-in{max-width:560px;margin:0 auto;display:grid;gap:22px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-head h2{margin:0;font-size:18px;font-weight:700;text-wrap:balance}
.done-btn{padding:9px 18px;border-radius:999px;border:0;background:var(--paper);color:var(--ink);font-weight:700;font-size:14px}
.sec{display:grid;gap:10px}
.sec h3{margin:0;font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--mist)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.note{margin:0;font-size:13px;line-height:1.7;color:var(--mist)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.lb{font-size:14px;font-weight:500;min-width:0}
.hint{display:block;font-size:11px;color:var(--mist);margin-top:2px}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--ink);border:1px solid var(--line);display:grid;place-items:center;touch-action:none}
.stepper button svg{width:18px;height:18px}
.stepper output{min-width:74px;text-align:center;font:500 17px var(--font-ui);font-variant-numeric:tabular-nums}
.item{display:flex;align-items:center;gap:8px;padding-block:6px;border-bottom:1px solid var(--line)}
.item input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--ink);color:var(--paper);padding-inline:12px;font:500 15px var(--font-ui)}
.item .stepper output{min-width:56px;font-size:15px}
.item .stepper button{width:38px}
.x{width:38px;height:44px;border-radius:12px;border:0;background:none;color:var(--mist);display:grid;place-items:center}
.x svg{width:18px;height:18px}
.wide{height:46px;border-radius:12px;border:1px dashed var(--line);background:none;color:var(--paper);font-weight:500;font-size:14px}
.my{display:flex;align-items:center;gap:6px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.sw{position:relative;width:52px;height:30px;flex:none;border-radius:999px;border:0;background:var(--ink);box-shadow:inset 0 0 0 1px var(--line);transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--mist);transition:transform .25s,background .25s}
.sw[aria-checked="true"]{background:var(--crimson)}
.sw[aria-checked="true"]::after{transform:translateX(22px);background:#fff}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-150%);z-index:30;max-width:calc(100% - 32px);
  padding:10px 16px;border-radius:999px;background:var(--ink2);border:1px solid var(--line);font-size:13px;font-weight:500;
  transition:transform .35s cubic-bezier(.2,.8,.2,1);pointer-events:none;text-align:center}
.toast.show{transform:translate(-50%,0)}

@media (max-height:660px){ :root{--U:min(100vw, 52vh, 560px)} .ctl .b{width:52px;height:52px} .ctl.main .b{width:72px;height:72px} .grove{height:30px} .bamboo{height:28px} }
@media (prefers-reduced-motion:reduce){
  #app.tense,#app.strike,.time.beat,.bamboo.cur::after{animation:none!important}
  .scene{transition:opacity .4s}
  #app[data-phase="work"] .scene[data-s="kamae"].on{transform:none}
}
</style>
</head>
<body>
<div class="world" aria-hidden="true">
  <div class="scene" data-s="kamae" style="background-image:url('assets/kamae.webp')"></div>
  <div class="scene" data-s="issen" style="background-image:url('assets/issen.webp')"></div>
  <div class="scene" data-s="issen_kesa" style="background-image:url('assets/issen_kesa.webp')"></div>
  <div class="scene" data-s="issen_gyaku" style="background-image:url('assets/issen_gyaku.webp')"></div>
  <div class="scene" data-s="issen_karatake" style="background-image:url('assets/issen_karatake.webp')"></div>
  <div class="scene" data-s="issen_jumonji" style="background-image:url('assets/issen_jumonji.webp')"></div>
  <div class="scene" data-s="noto" style="background-image:url('assets/noto.webp')"></div>
  <div class="scene" data-s="kanryo" style="background-image:url('assets/kanryo.webp')"></div>
  <canvas id="leaves"></canvas>
  <div class="shade"></div>
  <div class="vignette"></div>
</div>

<div id="app" data-phase="idle">
  <div class="world-fx" aria-hidden="true" style="position:fixed;inset:0;pointer-events:none;z-index:5"><div class="flash"></div><div class="slash"></div><div class="slash slash2"></div></div>
  <header class="top">
    <div class="bar">
      <div class="brand"><b>O</b>RBIT</div>
      <button class="icon-btn" id="gear" aria-label="設定を開く"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="モード"></nav>
  </header>

  <main class="main" id="stage" role="button" tabindex="0" aria-label="タイマー">
    <div class="phase" id="phase"><span class="kanji" id="kanji">構</span><span class="tx" id="label"></span></div>
    <div class="cap" id="cap"></div>
    <div class="time" id="time" aria-live="polite"></div>
    <div class="katana" id="katana" aria-hidden="true"><div class="tsuka"></div><div class="tsuba"></div><div class="blade"><i></i></div></div>
    <div class="sub" id="sub"></div>
    <div class="grove" id="grove" aria-hidden="true"></div>
    <div class="next" id="next"></div>
    <div class="laps" id="laps" hidden></div>
  </main>

  <footer class="foot">
    <div class="controls" id="controls"></div>
    <div class="presets" id="presets"></div>
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="設定" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';
const KEY = 'orbit-timer-v1';
const $ = s => document.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const pad = n => String(n).padStart(2, '0');

const MODES = [
  { id: 'rest', name: '休憩タイマー' },
  { id: 'interval', name: 'インターバル' },
  { id: 'circuit', name: 'サーキット' },
  { id: 'countdown', name: 'カウント' },
  { id: 'stopwatch', name: 'ストップウォッチ' },
];
const modeName = id => MODES.find(m => m.id === id).name;

const DEF = {
  interval: { prep: 10, work: 20, rest: 10, rounds: 8, sets: 1, setRest: 60 },
  // rest timer: today's exercises in order; sets 0 = no limit. Only the rest between sets is timed
  rest: { items: [
    { name: 'ベンチプレス', sets: 4, rest: 120 }, { name: 'インクラインダンベルプレス', sets: 3, rest: 90 },
    { name: 'ケーブルフライ', sets: 3, rest: 60 }, { name: 'ディップス', sets: 3, rest: 90 } ] },
  circuit: { prep: 10, gap: 15, rounds: 3, roundRest: 60, items: [
    { name: 'スクワット', dur: 40 }, { name: '腕立て伏せ', dur: 40 }, { name: 'ランジ', dur: 40 },
    { name: 'プランク', dur: 40 }, { name: 'バーピー', dur: 30 } ] },
  countdown: { min: 5, sec: 0 },
  stopwatch: {},
};

const PRESETS = {
  interval: [
    { name: 'タバタ 20/10×8', cfg: { prep: 10, work: 20, rest: 10, rounds: 8, sets: 1, setRest: 60 } },
    { name: 'HIIT 40/20×10', cfg: { prep: 10, work: 40, rest: 20, rounds: 10, sets: 1, setRest: 60 } },
    { name: '30/30×12', cfg: { prep: 10, work: 30, rest: 30, rounds: 12, sets: 1, setRest: 60 } },
    { name: 'EMOM 10分', cfg: { prep: 10, work: 60, rest: 0, rounds: 10, sets: 1, setRest: 60 } },
    { name: 'タバタ×3セット', cfg: { prep: 10, work: 20, rest: 10, rounds: 8, sets: 3, setRest: 60 } },
  ],
  rest: [
    { name: '胸の日', cfg: clone(DEF.rest) },
    { name: '背中の日', cfg: { items: [
      { name: 'デッドリフト', sets: 3, rest: 180 }, { name: '懸垂', sets: 4, rest: 120 },
      { name: 'ベントオーバーロー', sets: 3, rest: 120 }, { name: 'ラットプルダウン', sets: 3, rest: 90 } ] } },
    { name: '脚の日', cfg: { items: [
      { name: 'スクワット', sets: 5, rest: 180 }, { name: 'ルーマニアンデッドリフト', sets: 3, rest: 120 },
      { name: 'レッグプレス', sets: 3, rest: 120 }, { name: 'カーフレイズ', sets: 3, rest: 60 } ] } },
    { name: 'フリー（休憩90秒）', cfg: { items: [{ name: 'フリー', sets: 0, rest: 90 }] } },
  ],
  circuit: [
    { name: '全身 基本', cfg: clone(DEF.circuit) },
    { name: '体幹', cfg: { prep: 10, gap: 10, rounds: 2, roundRest: 45, items: [
      { name: 'プランク', dur: 45 }, { name: 'サイドプランク 右', dur: 30 }, { name: 'サイドプランク 左', dur: 30 },
      { name: 'マウンテンクライマー', dur: 30 }, { name: 'デッドバグ', dur: 40 }, { name: 'ヒップリフト', dur: 40 } ] } },
  ],
  countdown: [1, 3, 5, 10, 20].map(m => ({ name: m + '分', cfg: { min: m, sec: 0 } })),
  stopwatch: [],
};

// [key, label, min, max, step, hint, kind]
const FIELDS = {
  interval: [['prep', '準備', 0, 60, 5], ['work', '運動', 5, 600, 5], ['rest', '休憩', 0, 600, 5, '0 にすると休憩なし'],
    ['rounds', 'ラウンド数', 1, 30, 1, null, 'n'], ['sets', 'セット数', 1, 10, 1, null, 'n'], ['setRest', 'セット間の休憩', 0, 600, 15]],
  circuit: [['prep', '準備', 0, 60, 5], ['gap', '種目間の休憩', 0, 120, 5], ['rounds', 'ラウンド数', 1, 10, 1, null, 'n'], ['roundRest', 'ラウンド間の休憩', 0, 600, 15]],
  countdown: [['min', '分', 0, 180, 1, null, 'n'], ['sec', '秒', 0, 55, 5, null, 'n']],
};

const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5.2v13.6L19 12z" fill="currentColor"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.3"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.3"/></svg>',
  reset: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></svg>',
  skip: '<svg viewBox="0 0 24 24"><path d="M5.5 5.5v13l9.5-6.5z" fill="currentColor"/><path d="M18.5 5.5v13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>',
  cut: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 17L21 6"/><path d="M15 15l3 3" opacity=".6"/></svg>',
  lap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4M6 4h11l-2.2 4L17 12H6"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  minus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};

/* ---------- storage ---------- */
function load() {
  const s = { mode: 'rest', cfg: clone(DEF), prefs: { sound: true, voice: false, vibrate: true }, custom: {} };
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (d && typeof d === 'object') {
    if (MODES.some(m => m.id === d.mode)) s.mode = d.mode;
    if (d.cfg) for (const k in DEF) if (d.cfg[k]) s.cfg[k] = Object.assign(clone(DEF[k]), d.cfg[k]);
    if (d.prefs) Object.assign(s.prefs, d.prefs);
    if (d.custom && typeof d.custom === 'object') s.custom = d.custom;
    // the old set-rest mode kept one rest time and a set count; turn it into a one-exercise menu
    const old = d.cfg && d.cfg.rest;
    if (old && !Array.isArray(old.items)) s.cfg.rest = { items: [{ name: 'フリー', sets: old.sets || 0, rest: old.rest || 90 }] };
    if (s.custom.rest) s.custom.rest = s.custom.rest.filter(p => p.cfg && Array.isArray(p.cfg.items));
  }
  return s;
}
const store = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
const cfg = () => store.cfg[store.mode];

/* ---------- format ---------- */
function clock(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}
function remain(sec) { const c = Math.max(0, Math.ceil(sec - 1e-6)); return c < 60 ? String(c) : clock(c); }
function jp(sec) { const m = Math.floor(sec / 60), s = sec % 60; return m ? (s ? `${m}分${s}秒` : `${m}分`) : `${s}秒`; }
function summary(mode, c) {
  if (mode === 'interval') return `${c.work}/${c.rest} ×${c.rounds}` + (c.sets > 1 ? ` ×${c.sets}セット` : '');
  if (mode === 'circuit') return `${c.items.length}種目 ×${c.rounds}`;
  if (mode === 'countdown') return jp(c.min * 60 + c.sec);
  if (mode === 'rest') return c.items.slice(0, 2).map(it => it.name).join('・') + (c.items.length > 2 ? ` ほか${c.items.length - 2}種目` : '');
  return '';
}

/* ---------- sound: taiko, blade, bell (all synthesized) ---------- */
let ac = null, noiseBuf = null;
function audio() {
  if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) try { ac = new C(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
  if (ac && !noiseBuf) {
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 1.2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return ac;
}
function env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + d); }
function osc(type, f0, f1, at, d, vol) {
  const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + d);
  env(g, t, 0.008, vol, d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + 0.05);
}
function noise(at, d, vol, f0, f1, q) {
  const t = ac.currentTime + at, s = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; bp.type = 'bandpass'; bp.Q.value = q || 1.2;
  bp.frequency.setValueAtTime(f0, t); if (f1) bp.frequency.exponentialRampToValueAtTime(f1, t + d);
  env(g, t, 0.01, vol, d); s.connect(bp).connect(g).connect(ac.destination); s.start(t); s.stop(t + d + 0.05);
}
const CUES = {
  drum: () => { osc('sine', 150, 55, 0, 0.45, 0.7); noise(0, 0.06, 0.25, 900, 300, 0.8); },         // taiko, last 3 seconds
  bigdrum: () => { osc('sine', 120, 42, 0, 0.8, 0.9); noise(0, 0.1, 0.35, 700, 200, 0.7); },
  draw: () => { noise(0, 0.5, 0.12, 3000, 9000, 6); osc('sine', 2400, 2600, 0.05, 0.6, 0.05); },     // work starts: blade leaves the scabbard slightly
  slash: () => {                                                                                     // zero: one draw-cut
    noise(0, 0.28, 0.6, 600, 7000, 0.9);
    osc('sine', 2637, 0, 0.12, 1.4, 0.16); osc('sine', 3951, 0, 0.12, 1.0, 0.07);
    osc('sine', 90, 38, 0.1, 0.7, 0.8);
  },
  sheathe: () => { noise(0, 0.35, 0.1, 5000, 1500, 4); osc('triangle', 520, 0, 0.32, 0.25, 0.12); }, // rest: sword back in the scabbard
  bell: () => { [392, 588, 784].forEach((f, i) => osc('sine', f, 0, i * 0.02, 2.6, 0.18 / (i + 1))); },
  gong: () => { [98, 147, 196, 294].forEach((f, i) => osc('sine', f, f * 0.98, 0, 4 - i * 0.6, 0.35 / (i + 1))); noise(0, 0.2, 0.2, 400, 120, 0.6); },
  lap: () => osc('sine', 1760, 0, 0, 0.12, 0.08),
};
function play(n) { if (store.prefs.sound && ac) try { CUES[n](); } catch (e) {} }
function buzz(p) { if (store.prefs.vibrate && navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} }
function say(t) {
  if (!t || !store.prefs.voice || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; u.rate = 1.05; speechSynthesis.speak(u); } catch (e) {}
}
let wl = null;
async function wake(on) {
  try {
    if (on) { if (!wl && 'wakeLock' in navigator) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } }
    else if (wl) { const w = wl; wl = null; await w.release(); }
  } catch (e) { wl = null; }
}

/* ---------- segment engine (interval / circuit / countdown) ---------- */
function buildSegs(mode, c) {
  const s = [];
  if (mode === 'interval') {
    if (c.prep) s.push({ type: 'prep', dur: c.prep, label: '準備', sub: `${c.rounds}ラウンド` + (c.sets > 1 ? ` × ${c.sets}セット` : ''), orbs: c.rounds, lit: 0, orb: 0, speak: '構え' });
    for (let st = 0; st < c.sets; st++) {
      for (let r = 0; r < c.rounds; r++) {
        const sub = `ラウンド ${r + 1} / ${c.rounds}` + (c.sets > 1 ? `　セット ${st + 1} / ${c.sets}` : '');
        const last = st === c.sets - 1 && r === c.rounds - 1;
        s.push({ type: 'work', dur: c.work, label: last ? 'ラスト' : '運動', sub, orbs: c.rounds, lit: r, orb: r, speak: last ? 'ラスト' : '' });
        if (c.rest > 0 && r < c.rounds - 1) s.push({ type: 'rest', dur: c.rest, label: '休憩', sub, orbs: c.rounds, lit: r + 1, orb: r + 1, speak: '' });
      }
      if (st < c.sets - 1 && c.setRest > 0) s.push({ type: 'rest', dur: c.setRest, label: 'セット間休憩', sub: `セット ${st + 1} / ${c.sets} 完了`, orbs: c.rounds, lit: c.rounds, orb: -1, speak: 'セット間の休憩' });
    }
  } else if (mode === 'circuit') {
    const n = c.items.length;
    if (c.prep) s.push({ type: 'prep', dur: c.prep, label: '準備', sub: `${n}種目 × ${c.rounds}ラウンド`, orbs: n, lit: 0, orb: 0, speak: '最初は' + c.items[0].name });
    for (let r = 0; r < c.rounds; r++) {
      c.items.forEach((it, i) => {
        const sub = `種目 ${i + 1} / ${n}　ラウンド ${r + 1} / ${c.rounds}`;
        s.push({ type: 'work', dur: it.dur, label: it.name || `種目${i + 1}`, sub, orbs: n, lit: i, orb: i, speak: it.name, long: true });
        if (c.gap > 0 && i < n - 1) s.push({ type: 'rest', dur: c.gap, label: '休憩', sub, orbs: n, lit: i + 1, orb: i + 1, speak: '次は' + c.items[i + 1].name });
      });
      if (r < c.rounds - 1 && c.roundRest > 0) s.push({ type: 'rest', dur: c.roundRest, label: 'ラウンド間休憩', sub: `ラウンド ${r + 1} / ${c.rounds} 完了`, orbs: n, lit: n, orb: -1, speak: 'ラウンド間の休憩' });
    }
  } else if (mode === 'countdown') {
    s.push({ type: 'work', dur: Math.max(5, c.min * 60 + c.sec), label: '残り', sub: '', orbs: 0, lit: 0, orb: -1, speak: '' });
  }
  return s;
}
const T = { status: 'idle', segs: [], idx: 0, segStart: 0, pausedAt: 0, beep: '' };
function rebuild() { T.segs = buildSegs(store.mode, cfg()); T.idx = 0; T.status = 'idle'; T.beep = ''; }
function segStartRun() {
  audio();
  if (T.status === 'idle' || T.status === 'done') { rebuild(); T.status = 'running'; T.segStart = Date.now(); enter(false, null); }
  else if (T.status === 'paused') { T.segStart += Date.now() - T.pausedAt; T.status = 'running'; }
  wake(true);
}
function segPause() { T.pausedAt = Date.now(); T.status = 'paused'; wake(false); }
function segSkip() {
  const now = T.status === 'paused' ? T.pausedAt : Date.now(), prev = T.segs[T.idx];
  T.idx++; T.segStart = now;
  if (T.idx >= T.segs.length) segFinish(prev); else enter(false, prev);
}
// prev = the segment that just ended; finishing a work segment is the strike
function enter(quiet, prev) {
  const s = T.segs[T.idx];
  if (prev && prev.type === 'work' && !quiet) strike();
  if (quiet) return;
  if (s.type === 'work') { if (!prev || prev.type !== 'work') play('draw'); buzz([60, 40, 60]); }
  else if (s.type === 'rest') { setTimeout(() => play('sheathe'), 700); buzz(200); }
  else play('bell');
  say(s.speak);
}
function segFinish(prev) {
  T.status = 'done'; T.idx = T.segs.length - 1;
  if (prev && prev.type === 'work') strike(true);
  setTimeout(() => { play('gong'); say('お見事'); }, 900);
  buzz([200, 100, 200, 100, 500]); wake(false);
}
function segTick() {
  if (T.status !== 'running') return;
  const now = Date.now();
  while (now - T.segStart >= T.segs[T.idx].dur * 1000) {
    const prev = T.segs[T.idx];
    T.segStart += prev.dur * 1000; T.idx++;
    if (T.idx >= T.segs.length) { segFinish(prev); return; }
    enter(now - T.segStart > 1500, prev); // quiet while catching up after the app was in the background
  }
  const s = T.segs[T.idx], c = Math.ceil(s.dur - (now - T.segStart) / 1000);
  if (c >= 1 && c <= 3 && s.dur > 3) {
    const key = T.idx + ':' + c;
    if (T.beep !== key) { T.beep = key; play(c === 1 && s.type === 'work' ? 'bigdrum' : 'drum'); buzz(40); beat(); }
  }
}
function viewSeg() {
  const segs = T.segs, c = cfg();
  const total = segs.reduce((a, s) => a + s.dur, 0);
  const first = segs.find(s => s.type !== 'prep') || segs[0];
  if (T.status === 'idle') {
    let sub = '';
    if (store.mode === 'interval') sub = `運動${jp(c.work)}　休憩${jp(c.rest)}　× ${c.rounds}` + (c.sets > 1 ? ` × ${c.sets}` : '');
    else if (store.mode === 'circuit') sub = `${c.items.length}種目 × ${c.rounds}ラウンド`;
    return { phase: 'idle', label: modeName(store.mode), time: clock(total), sub, next: 'タップで構える', fill: 0, rounds: { n: first.orbs, lit: 0, cur: -1 } };
  }
  if (T.status === 'done') return { phase: 'done', label: '完了', time: clock(total), sub: 'お見事', next: `合計 ${jp(total)}`, fill: 1, rounds: { n: first.orbs, lit: first.orbs, cur: -1 } };
  const s = segs[T.idx], now = T.status === 'paused' ? T.pausedAt : Date.now();
  const rem = Math.max(0, s.dur - (now - T.segStart) / 1000), nx = segs[T.idx + 1];
  const f = rem / s.dur;
  return {
    phase: s.type, label: T.status === 'paused' ? '一時停止中' : s.label, long: s.long && T.status !== 'paused',
    time: remain(rem), sub: s.sub, next: nx ? `次　${nx.label}　${jp(nx.dur)}` : 'これで最後',
    fill: s.type === 'work' ? 1 - f : f, charge: s.type === 'work' ? 1 - f : 0,
    tension: s.type === 'work' && T.status === 'running' ? clamp((3.2 - rem) / 3.2, 0, 1) : 0,
    rounds: { n: s.orbs, lit: s.lit, cur: s.orb },
  };
}

/* ---------- rest timer (gym: only the rest is timed; tap when a set ends = the cut) ----------
   phase 'ready': training, nothing counts; the screen shows the rest that the next tap starts.
   phase 'rest': counting down. When it ends, the timer is set to the next rest (next set, or the next exercise). */
const R = { phase: 'ready', item: 0, done: [], restStart: 0, restDur: 0, beep: '', started: false };
const items = () => cfg().items;
function syncDone() {
  const n = items().length;
  while (R.done.length < n) R.done.push(0);
  R.done.length = n;
  R.item = clamp(R.item, 0, n - 1);
}
const itemDone = i => { const it = items()[i]; return it.sets > 0 && R.done[i] >= it.sets; };
const allDone = () => items().every((_, i) => itemDone(i));
function nextOpenItem(from) {
  const n = items().length;
  for (let k = 1; k <= n; k++) { const i = (from + k) % n; if (!itemDone(i)) return i; }
  return -1;
}
function resetRest() { R.phase = 'ready'; R.item = 0; R.done = []; R.started = false; syncDone(); wake(false); }
function completeSet() {
  audio(); syncDone();
  R.done[R.item]++; R.started = true;
  const finished = allDone();
  strike(finished);
  if (finished) {
    R.phase = 'done'; setTimeout(() => { play('gong'); say('全種目完了。お見事'); }, 900); buzz([200, 100, 200, 100, 500]); wake(false);
    return;
  }
  R.phase = 'rest'; R.restStart = Date.now(); R.restDur = items()[R.item].rest; R.beep = '';
  setTimeout(() => play('sheathe'), 700); buzz(200); wake(true);
}
function endRest() {
  syncDone();
  const was = R.item;
  if (itemDone(R.item)) { const n = nextOpenItem(R.item); if (n >= 0) R.item = n; }
  R.phase = 'ready';
  const it = items()[R.item], set = R.done[R.item] + 1;
  play('draw'); buzz([60, 40, 60]);
  say(R.item !== was ? `次は${it.name}` : it.sets > 0 && set === it.sets ? 'ラストセット' : `${set}セット目`);
}
// while training this changes the exercise's rest time and keeps it; while resting it changes only this rest
function adjRest(d) {
  if (R.phase === 'rest') {
    R.restDur = Math.max(5, R.restDur + d);
    if (R.restDur - (Date.now() - R.restStart) / 1000 <= 0) endRest();
    toast(`この休憩を${Math.abs(d)}秒${d > 0 ? 'のばしました' : '短くしました'}`);
    return;
  }
  const it = items()[R.item];
  it.rest = clamp(it.rest + d, 15, 900); save();
  toast(`${it.name}の休憩を${jp(it.rest)}にしました`);
}
function jumpItem(i) {
  syncDone();
  if (i < 0 || i >= items().length || R.phase === 'done') return;
  R.item = i;
  if (R.phase === 'ready') toast(`${items()[i].name}にしました`);
}
function restTick() {
  if (R.phase !== 'rest') return;
  const rem = R.restDur - (Date.now() - R.restStart) / 1000;
  if (rem <= 0) { endRest(); return; }
  const c = Math.ceil(rem);
  if (c <= 3 && R.beep !== c) { R.beep = c; play('drum'); buzz(40); beat(); }
}
function setLabel(i) { const it = items()[i], n = Math.min(R.done[i] + 1, it.sets || Infinity); return it.sets > 0 ? `セット ${n} / ${it.sets}` : `${n}セット目`; }
function viewRest() {
  syncDone();

  let h = `<div class="sec"><h3>メニュー</h3><div class="chips">${allPresets().map((p, i) => `<button class="chip${presetOn(p) ? ' on' : ''}" data-p="${i}">${esc(p.name)}</button>`).join('')}</div>` +
    `<p class="note">選ぶと今日の種目が入れ替わり、進み具合は最初に戻ります。</p></div>`;
  h += `<div class="sec"><h3>今日の種目（上から順に）</h3><div>` + c.items.map((it, i) =>
    `<div class="menu-item"><div class="row"><input id="ritem-${i}" data-rname="${i}" value="${esc(it.name)}" maxlength="24" aria-label="種目${i + 1}の名前">` +
    `<button class="x" data-rdel="${i}" aria-label="${esc(it.name)}を消す" ${c.items.length <= 1 ? 'disabled' : ''}>${ICON.x}</button></div>` +
    `<div class="nums"><span class="num">セット数${stepper('rs-' + i, it.sets || '∞', `data-ik="sets" data-ii="${i}"`)}</span>` +
    `<span class="num">休憩${stepper('rr-' + i, jp(it.rest), `data-ik="rest" data-ii="${i}"`)}</span></div>` +
    `<span class="prog">${R.done[i]}セット済み</span></div>`).join('') +
    `</div>${c.items.length < 15 ? '<button class="wide" data-act="radd">＋ 種目を追加</button>' : ''}<p class="note">セット数を 0（∞）にすると、回数を決めずに続けられます。</p></div>`;
  h += `<div class="sec"><h3>マイメニュー</h3>` +
    (mine.length ? `<div class="chips">${mine.map((p, i) => `<span class="my"><button class="chip" data-p="${PRESETS.rest.length + i}">${esc(p.name)}</button><button class="x" data-mydel="${i}" aria-label="${esc(p.name)}を消す">${ICON.x}</button></span>`).join('')}</div>` : '<p class="note">今日の種目を保存すると、次から1タップで呼び出せます。</p>') +
    (mine.length < 8 ? `<div class="row-save"><input id="menu-name" placeholder="メニューの名前（例：胸の日）" maxlength="16" aria-label="保存するメニューの名前"><button class="wide" data-act="rsave">今の種目を保存</button></div>` : '') + `</div>`;
  h += `<div class="sec"><button class="wide" data-act="rreset">進み具合を最初に戻す</button></div>`;
  return h;
}
function changeRestItem(i, k, d) {
  const it = items()[i];
  if (k === 'sets') { it.sets = clamp(it.sets + d, 0, 20); const o = $('#rs-' + i); if (o) o.textContent = it.sets || '∞'; }
  else { it.rest = clamp(it.rest + d * 15, 15, 900); const o = $('#rr-' + i); if (o) o.textContent = jp(it.rest); }
  save(); refreshChips(); render();
}
function changeField(k, d) {
  const f = FIELDS[store.mode].find(x => x[0] === k), c = cfg();
  c[k] = clamp(c[k] + d * f[4], f[2], f[3]);
  if (store.mode === 'countdown' && c.min === 0 && c.sec === 0) c.sec = 5;
  save(); rebuild();
  const out = $('#f-' + k); if (out) out.textContent = fmtField(f, c[k]);
  if (store.mode === 'countdown') { const s = $('#f-sec'); if (s) s.textContent = String(c.sec); }
  refreshChips(); render();
}
function changeItem(i, d) {
  const it = cfg().items[i]; it.dur = clamp(it.dur + d * 5, 5, 300);
  save(); rebuild(); const out = $('#it-' + i); if (out) out.textContent = jp(it.dur); refreshChips(); render();
}
function refreshChips() {
  sheet.querySelectorAll('.chip[data-p]').forEach(el => el.classList.toggle('on', presetOn(allPresets()[+el.dataset.p])));
  renderPresets();
}
let holdT = 0, holdI = 0;
function stopHold() { clearTimeout(holdT); clearInterval(holdI); }
sheet.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-d]'); if (!b) return;
  e.preventDefault();
  const d = +b.dataset.d, run = () => b.dataset.f ? changeField(b.dataset.f, d) : b.dataset.ik ? changeRestItem(+b.dataset.ii, b.dataset.ik, d) : changeItem(+b.dataset.it, d);
  run(); stopHold(); holdT = setTimeout(() => { holdI = setInterval(run, 70); }, 380);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => sheet.addEventListener(t, stopHold));
sheet.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || t.dataset.d) return;
  const m = store.mode, c = cfg();
  if (t.dataset.p != null) return applyPreset(+t.dataset.p);
  if (t.dataset.pref) { store.prefs[t.dataset.pref] = !store.prefs[t.dataset.pref]; t.setAttribute('aria-checked', store.prefs[t.dataset.pref]); save(); audio(); return; }
  if (t.dataset.del != null) { c.items.splice(+t.dataset.del, 1); save(); rebuild(); buildSheet(); renderPresets(); render(); return; }
  if (t.dataset.mydel != null) { store.custom[m].splice(+t.dataset.mydel, 1); save(); buildSheet(); renderPresets(); render(); return; }
  if (t.dataset.rdel != null) { const i = +t.dataset.rdel; c.items.splice(i, 1); R.done.splice(i, 1); if (R.item > i) R.item--; syncDone(); save(); buildSheet(); renderPresets(); render(); return; }
  const act = t.dataset.act;
  if (act === 'radd') { c.items.push({ name: `種目${c.items.length + 1}`, sets: 3, rest: 90 }); syncDone(); save(); buildSheet(); renderPresets(); render(); const inp = $('#ritem-' + (c.items.length - 1)); if (inp) { inp.focus(); inp.select(); } return; }
  if (act === 'rsave') {
    const name = ($('#menu-name').value || '').trim() || summary('rest', c);
    (store.custom.rest = store.custom.rest || []).push({ name, cfg: clone(c) }); save(); buildSheet(); toast(`「${name}」を保存しました`); return;
  }
  if (act === 'rreset') { resetRest(); buildSheet(); renderPresets(); render(); toast('進み具合を最初に戻しました'); return; }
  if (act === 'close') closeSheet();
  else if (act === 'add') { c.items.push({ name: `種目${c.items.length + 1}`, dur: 30 }); save(); rebuild(); buildSheet(); render(); const inp = $('#item-' + (c.items.length - 1)); if (inp) inp.focus(); }
  else if (act === 'savepreset') { (store.custom[m] = store.custom[m] || []).push({ name: summary(m, c), cfg: clone(c) }); save(); buildSheet(); renderPresets(); render(); toast('マイプリセットに保存しました'); }
  else if (act === 'test') { audio(); const was = store.prefs.sound; store.prefs.sound = true; closeSheet(); setTimeout(() => { strike(); store.prefs.sound = was; }, 350); }
});
sheet.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.name != null) { cfg().items[+t.dataset.name].name = t.value.trim(); save(); rebuild(); render(); }
  else if (t.dataset.rname != null) { items()[+t.dataset.rname].name = t.value.trim() || `種目${+t.dataset.rname + 1}`; save(); render(); }
});
scrim.addEventListener('click', closeSheet);

/* ---------- events ---------- */
$('#gear').addEventListener('click', openSheet);
$('#tabs').addEventListener('click', e => { const t = e.target.closest('[data-m]'); if (t) switchMode(t.dataset.m); });
presetsEl.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.i != null) { jumpItem(+t.dataset.i); render(); }
  else if (t.dataset.act === 'edit') openSheet();
  else if (t.dataset.p != null) applyPreset(+t.dataset.p);
});
ctlEl.addEventListener('click', e => { const t = e.target.closest('[data-k]'); if (t && !t.disabled) { const b = ctlFns[t.dataset.k]; if (b && b.fn) b.fn(); } });
function stageAction() { const c = ctlFns.c || controls().c; if (c.fn && !c.noStage && !c.dis) c.fn(); }
stage.addEventListener('click', stageAction);
document.addEventListener('keydown', e => {
  if (sheetOpen) { if (e.key === 'Escape') closeSheet(); return; }
  if (e.key === ' ' || e.key === 'Enter') { if (e.target.closest && e.target.closest('button,input')) return; e.preventDefault(); stageAction(); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (isActive()) wake(true); logic(); render(); } });

function frame() { logic(); render(); stepLeaves(); requestAnimationFrame(frame); }
setInterval(logic, 250); // keeps phases advancing when animation frames are throttled

rebuild(); renderTabs(); renderPresets(); render(); requestAnimationFrame(frame);

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}
})();
</script>
</body>
</html>
