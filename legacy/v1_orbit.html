<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!--PWA-->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06070c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ORBIT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<!--/PWA-->
<title>ORBIT Timer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: one-screen instrument. Mode rail on top, an orbital dial in the middle (ring = time left, orbs = rounds/sets), thumb-zone controls at the bottom. */
@property --p  { syntax: "<color>"; inherits: true; initial-value: #a995ff; }
@property --p2 { syntax: "<color>"; inherits: true; initial-value: #5fe3ff; }
:root{
  --bg:#06070c; --surface:#0f121c; --surface2:#171b2a; --fg:#eef1f8; --muted:#8b91a8; --line:rgba(190,200,255,.11);
  --work:#ff5a2c; --work2:#ffb547;
  --rest:#1fc8ff; --rest2:#8a96ff;
  --prep:#ffcc4d; --prep2:#ff8f3c;
  --calm:#a995ff; --calm2:#5fe3ff;
  --done:#c9b6ff; --done2:#fff1c9;
  --font-num:"Oxanium","Chakra Petch",ui-monospace,"SF Mono",monospace;
  --font-ui:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --S:min(86vw, 50vh, 520px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;box-sizing:border-box;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--p2);outline-offset:3px}

#app{--p:var(--calm);--p2:var(--calm2);transition:--p .7s ease,--p2 .7s ease;
  height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px;position:relative;isolation:isolate;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 14px}
#app[data-phase="work"]{--p:var(--work);--p2:var(--work2)}
#app[data-phase="rest"]{--p:var(--rest);--p2:var(--rest2)}
#app[data-phase="prep"]{--p:var(--prep);--p2:var(--prep2)}
#app[data-phase="done"]{--p:var(--done);--p2:var(--done2)}
#app::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(50% 36% at 50% 46%, color-mix(in srgb,var(--p) 26%,transparent), transparent 72%),
    radial-gradient(90% 50% at 50% 110%, color-mix(in srgb,var(--p2) 12%,transparent), transparent 70%)}

/* top */
.top{display:grid;gap:10px}
.bar{display:flex;align-items:center;justify-content:space-between}
.brand{font:500 13px/1 var(--font-num);letter-spacing:.42em;color:var(--muted)}
.brand b{color:var(--p2);font-weight:700}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 70%,transparent);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:500;font-size:13px;letter-spacing:.04em;transition:color .3s,background .3s,border-color .3s}
.tab[aria-selected="true"]{color:var(--fg);background:var(--surface2);border-color:color-mix(in srgb,var(--p) 55%,transparent)}

/* dial */
.main{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.stage{width:var(--S);height:var(--S);max-width:100%;position:relative;border-radius:50%;cursor:pointer;flex:none}
.orbit-line{position:absolute;inset:4.5%;border-radius:50%;border:1px dashed rgba(200,210,255,.08)}
.disc{position:absolute;inset:19%;border-radius:50%;border:1px solid var(--line);
  background:radial-gradient(circle at 50% 30%, rgba(255,255,255,.06), rgba(255,255,255,.012) 62%), radial-gradient(circle, color-mix(in srgb,var(--p) 10%,transparent), transparent 70%)}
.ring{position:absolute;inset:11%;width:78%;height:78%;overflow:visible}
.track{fill:none;stroke:rgba(200,210,255,.08);stroke-width:5}
.prog{fill:none;stroke:url(#pg);stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 5px var(--p))}
.tick{stroke:rgba(200,210,255,.13);stroke-width:1.1;stroke-linecap:round;transition:stroke .4s}
.tick.on{stroke:var(--p2)}
.head{fill:#fff;filter:drop-shadow(0 0 6px var(--p2))}
.stage.flash .ring{animation:flash .7s cubic-bezier(.2,.8,.2,1)}
@keyframes flash{0%{transform:scale(1)}25%{transform:scale(1.045)}100%{transform:scale(1)}}

.orbit{position:absolute;inset:0;animation:spin 140s linear infinite;animation-play-state:paused}
#app.running .orbit{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.orb{position:absolute;left:50%;top:50%;width:var(--o);height:var(--o);margin:calc(var(--o) / -2) 0 0 calc(var(--o) / -2);border-radius:50%;
  transform:rotate(var(--a)) translateY(calc(var(--S) * -.455));
  border:1px solid rgba(220,225,255,.16);background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.12), rgba(255,255,255,.02) 62%);
  transition:background .6s,box-shadow .6s,border-color .6s}
.orb.lit{border-color:transparent;
  background:radial-gradient(circle at 34% 30%, #fff 0 7%, var(--p2) 30%, var(--p) 70%, color-mix(in srgb,var(--p) 45%,#000) 100%);
  box-shadow:0 0 calc(var(--o) * .7) color-mix(in srgb,var(--p) 65%,transparent)}
.orb.cur{border-color:var(--p2);background:radial-gradient(circle at 35% 30%, color-mix(in srgb,var(--p2) 45%,transparent), transparent 70%)}
.orb.cur::after{content:"";position:absolute;inset:-40%;border-radius:50%;border:1.5px solid var(--p2);animation:ping 1.6s ease-out infinite}
@keyframes ping{from{transform:scale(.55);opacity:.95}to{transform:scale(1.2);opacity:0}}
#app.celebrate .orb.lit{animation:flare 1.4s ease-out both;animation-delay:calc(var(--i) * 60ms)}
@keyframes flare{0%{filter:brightness(1)}30%{filter:brightness(2.2);transform:rotate(var(--a)) translateY(calc(var(--S) * -.49)) scale(1.3)}100%{filter:brightness(1)}}

.readout{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--S) * .018);text-align:center;pointer-events:none}
.phase{font-weight:700;font-size:max(12px,calc(var(--S) * .042));line-height:1.1;letter-spacing:.2em;color:var(--p2);max-width:56%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:.2em}
.phase.long{letter-spacing:.04em;padding-left:0}
.time{font-family:var(--font-num);font-weight:500;line-height:.92;font-size:calc(var(--S) * var(--k,.25));display:flex;align-items:flex-end;color:var(--fg);
  text-shadow:0 0 calc(var(--S) * .08) color-mix(in srgb,var(--p) 50%,transparent)}
.time .d{display:inline-block;width:.6em;text-align:center}
.time .c{display:inline-block;width:.28em;text-align:center;transform:translateY(-.06em)}
.time .t{font-size:.42em;width:1.1em;text-align:left;padding-bottom:.08em;color:var(--muted)}
.time.beat{animation:beat .6s cubic-bezier(.2,.8,.2,1)}
@keyframes beat{0%{transform:scale(1.12);color:var(--p2)}100%{transform:scale(1)}}
.sub{font-weight:500;font-size:max(12px,calc(var(--S) * .036));color:var(--fg);opacity:.9;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next{font-size:max(11px,calc(var(--S) * .03));color:var(--muted);max-width:56%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.laps{display:grid;gap:4px;width:min(100%,320px);font:500 14px var(--font-num);color:var(--muted)}
.laps div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-block:4px}
.laps div:first-child{color:var(--fg)}

/* controls */
.foot{display:grid;gap:12px}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;justify-items:center}
.ctl{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;padding:0;font-size:12px;font-weight:500;color:var(--muted);min-width:0}
.ctl .b{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--fg);transition:transform .15s}
.ctl .b svg{width:24px;height:24px}
.ctl .b .tx{font:700 17px var(--font-num)}
.ctl.main{color:var(--fg)}
.ctl.main .b{width:90px;height:90px;border:0;color:#0b0b12;
  background:radial-gradient(circle at 34% 28%, color-mix(in srgb,var(--p2) 70%,#fff), var(--p2) 28%, var(--p) 78%);
  box-shadow:0 12px 44px -10px color-mix(in srgb,var(--p) 80%,transparent), inset 0 -6px 14px rgba(0,0,0,.18)}
.ctl.main .b svg{width:34px;height:34px}
.ctl:active .b{transform:scale(.93)}
.ctl:disabled{opacity:.28;cursor:default}
.ctl:disabled:active .b{transform:none}
.presets{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px;min-height:38px}
.presets::-webkit-scrollbar{display:none}
.presets.off{visibility:hidden}
.chip{flex:none;padding:9px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{border-color:var(--p);color:var(--p2);background:color-mix(in srgb,var(--p) 12%,var(--surface))}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(2,3,8,.6);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:86%;overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;transform:translateY(105%);
  transition:transform .38s cubic-bezier(.2,.8,.2,1);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(24px + env(safe-area-inset-bottom,0px));
  -webkit-user-select:auto;user-select:auto}
.sheet.open{transform:none}
.sheet-in{max-width:560px;margin:0 auto;display:grid;gap:22px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-head h2{margin:0;font-size:18px;font-weight:700;text-wrap:balance}
.done-btn{padding:9px 18px;border-radius:999px;border:0;background:var(--fg);color:var(--bg);font-weight:700;font-size:14px}
.sec{display:grid;gap:10px}
.sec h3{margin:0;font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.note{margin:0;font-size:13px;line-height:1.7;color:var(--muted)}
.fields{display:grid}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label,.field .lb{font-size:14px;font-weight:500;min-width:0}
.field .hint{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;touch-action:none}
.stepper button svg{width:18px;height:18px}
.stepper output{min-width:74px;text-align:center;font:500 17px var(--font-num);font-variant-numeric:tabular-nums}
.item{display:flex;align-items:center;gap:8px;padding-block:6px;border-bottom:1px solid var(--line)}
.item input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding-inline:12px;font:500 15px var(--font-ui)}
.item .stepper output{min-width:56px;font-size:15px}
.item .stepper button{width:38px;height:44px}
.x{width:38px;height:44px;border-radius:12px;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.x svg{width:18px;height:18px}
.wide{height:46px;border-radius:12px;border:1px dashed var(--line);background:none;color:var(--fg);font-weight:500;font-size:14px}
.my{display:flex;align-items:center;gap:6px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.sw{position:relative;width:52px;height:30px;flex:none;border-radius:999px;border:0;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line);transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .25s,background .25s}
.sw[aria-checked="true"]{background:color-mix(in srgb,var(--p) 70%,var(--surface2))}
.sw[aria-checked="true"]::after{transform:translateX(22px);background:#fff}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);z-index:30;max-width:calc(100% - 32px);
  padding:10px 16px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:500;
  transition:transform .35s cubic-bezier(.2,.8,.2,1);pointer-events:none;text-align:center}
.toast.show{transform:translate(-50%,0)}

@media (max-height:640px){ :root{--S:min(86vw, 46vh, 520px)} .ctl .b{width:54px;height:54px} .ctl.main .b{width:76px;height:76px} .tabs .tab{padding-block:7px} }
@media (prefers-reduced-motion:reduce){
  .orbit,.orb.cur::after,#app.celebrate .orb.lit,.time.beat,.stage.flash .ring{animation:none!important}
  #app{transition:none}
}
</style>
</head>
<body>
<div id="app" data-phase="idle">
  <header class="top">
    <div class="bar">
      <div class="brand"><b>O</b>RBIT</div>
      <button class="icon-btn" id="gear" aria-label="設定を開く"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="モード"></nav>
  </header>

  <main class="main">
    <div class="stage" id="stage" role="button" tabindex="0" aria-label="タイマー">
      <div class="orbit-line"></div>
      <div class="disc"></div>
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" style="stop-color:var(--p2)"/>
            <stop offset="1" style="stop-color:var(--p)"/>
          </linearGradient>
        </defs>
        <g id="ticks"></g>
        <circle class="track" cx="100" cy="100" r="84"/>
        <circle class="prog" id="prog" cx="100" cy="100" r="84" transform="rotate(-90 100 100)"/>
        <circle class="head" id="head" r="4.5" cx="100" cy="16"/>
      </svg>
      <div class="orbit" id="orbit"></div>
      <div class="readout" aria-live="polite">
        <div class="phase" id="phase"></div>
        <div class="time" id="time"></div>
        <div class="sub" id="sub"></div>
        <div class="next" id="next"></div>
      </div>
    </div>
    <div class="laps" id="laps" hidden></div>
  </main>

  <footer class="foot">
    <div class="controls" id="controls"></div>
    <div class="presets" id="presets"></div>
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="設定" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';
const KEY = 'orbit-timer-v1';
const $ = s => document.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const pad = n => String(n).padStart(2, '0');

const MODES = [
  { id: 'interval', name: 'インターバル' },
  { id: 'rest', name: 'セット休憩' },
  { id: 'circuit', name: 'サーキット' },
  { id: 'countdown', name: 'カウント' },
  { id: 'stopwatch', name: 'ストップウォッチ' },
];
const modeName = id => MODES.find(m => m.id === id).name;

const DEF = {
  interval: { prep: 10, work: 20, rest: 10, rounds: 8, sets: 1, setRest: 60 },
  rest: { rest: 90, sets: 5 },
  circuit: { prep: 10, gap: 15, rounds: 3, roundRest: 60, items: [
    { name: 'スクワット', dur: 40 }, { name: '腕立て伏せ', dur: 40 }, { name: 'ランジ', dur: 40 },
    { name: 'プランク', dur: 40 }, { name: 'バーピー', dur: 30 } ] },
  countdown: { min: 5, sec: 0 },
  stopwatch: {},
};

const PRESETS = {
  interval: [
    { name: 'タバタ 20/10×8', cfg: { prep: 10, work: 20, rest: 10, rounds: 8, sets: 1, setRest: 60 } },
    { name: 'HIIT 40/20×10', cfg: { prep: 10, work: 40, rest: 20, rounds: 10, sets: 1, setRest: 60 } },
    { name: '30/30×12', cfg: { prep: 10, work: 30, rest: 30, rounds: 12, sets: 1, setRest: 60 } },
    { name: 'EMOM 10分', cfg: { prep: 10, work: 60, rest: 0, rounds: 10, sets: 1, setRest: 60 } },
    { name: 'タバタ×3セット', cfg: { prep: 10, work: 20, rest: 10, rounds: 8, sets: 3, setRest: 60 } },
  ],
  rest: [
    { name: '休憩 1分', cfg: { rest: 60 } }, { name: '1分30秒', cfg: { rest: 90 } },
    { name: '2分', cfg: { rest: 120 } }, { name: '3分', cfg: { rest: 180 } },
  ],
  circuit: [
    { name: '全身 基本', cfg: clone(DEF.circuit) },
    { name: '体幹', cfg: { prep: 10, gap: 10, rounds: 2, roundRest: 45, items: [
      { name: 'プランク', dur: 45 }, { name: 'サイドプランク 右', dur: 30 }, { name: 'サイドプランク 左', dur: 30 },
      { name: 'マウンテンクライマー', dur: 30 }, { name: 'デッドバグ', dur: 40 }, { name: 'ヒップリフト', dur: 40 } ] } },
  ],
  countdown: [1, 3, 5, 10, 20].map(m => ({ name: m + '分', cfg: { min: m, sec: 0 } })),
  stopwatch: [],
};

// [key, label, min, max, step, hint]
const FIELDS = {
  interval: [['prep', '準備', 0, 60, 5], ['work', '運動', 5, 600, 5], ['rest', '休憩', 0, 600, 5, '0 にすると休憩なし'],
    ['rounds', 'ラウンド数', 1, 30, 1, null, 'n'], ['sets', 'セット数', 1, 10, 1, null, 'n'], ['setRest', 'セット間の休憩', 0, 600, 15]],
  rest: [['rest', '休憩時間', 15, 600, 15], ['sets', '目標セット数', 1, 20, 1, null, 'n']],
  circuit: [['prep', '準備', 0, 60, 5], ['gap', '種目間の休憩', 0, 120, 5], ['rounds', 'ラウンド数', 1, 10, 1, null, 'n'], ['roundRest', 'ラウンド間の休憩', 0, 600, 15]],
  countdown: [['min', '分', 0, 180, 1, null, 'n'], ['sec', '秒', 0, 55, 5, null, 'n']],
};

const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5.2v13.6L19 12z" fill="currentColor"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.3"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.3"/></svg>',
  reset: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></svg>',

    if (last.laps !== lk) {
      last.laps = lk;
      lapsEl.innerHTML = W.laps.slice(-3).reverse().map((l, i) =>
        `<div><span>LAP ${lk - i}</span><span>${clock(l.d / 1000)}.${Math.floor(l.d % 1000 / 100)}</span></div>`).join('');
    }
  } else lapsEl.hidden = true;
}
function renderOrbs(o) {
  const n = clamp(o.n, 1, 30);
  if (n !== orbN) {
    orbN = n;
    const size = n <= 6 ? .085 : n <= 10 ? .068 : n <= 16 ? .052 : .04;
    orbit.style.setProperty('--o', `calc(var(--S) * ${size})`);
    orbit.innerHTML = Array.from({ length: n }, (_, i) => `<i class="orb" style="--a:${(i * 360 / n).toFixed(2)}deg;--i:${i}"></i>`).join('');
    last.orbs = '';
  }
  const k = o.lit + ':' + o.cur;
  if (last.orbs === k) return;
  last.orbs = k;
  [...orbit.children].forEach((el, i) => { el.classList.toggle('lit', i < o.lit); el.classList.toggle('cur', i === o.cur && i >= o.lit); });
}
function flash() { stage.classList.remove('flash'); void stage.offsetWidth; stage.classList.add('flash'); }
function beat() { timeEl.classList.remove('beat'); void timeEl.offsetWidth; timeEl.classList.add('beat'); }
function celebrate() { app.classList.remove('celebrate'); void app.offsetWidth; app.classList.add('celebrate'); setTimeout(() => app.classList.remove('celebrate'), 3000); }
let toastT = 0;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ---------- tabs & presets ---------- */
let pendingMode = null, pendingT = 0;
function renderTabs() {
  $('#tabs').innerHTML = MODES.map(m => `<button class="tab" role="tab" data-m="${m.id}" aria-selected="${m.id === store.mode}">${m.name}</button>`).join('');
  const cur = $('#tabs [aria-selected="true"]');
  if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
function switchMode(id) {
  if (id === store.mode) return;
  if (busy() && pendingMode !== id) {
    pendingMode = id; clearTimeout(pendingT); pendingT = setTimeout(() => { pendingMode = null; }, 2600);
    toast('もう一度タップで切り替え（今のタイマーはリセット）'); return;
  }
  pendingMode = null;
  store.mode = id; save(); resetAll(); renderTabs(); renderPresets(); render();
}
function presetOn(p) {
  const c = cfg();
  return Object.keys(p.cfg).every(k => JSON.stringify(c[k]) === JSON.stringify(p.cfg[k]));
}
function allPresets() { return PRESETS[store.mode].concat(store.custom[store.mode] || []); }
function renderPresets() {
  presetsEl.innerHTML = allPresets().map((p, i) => `<button class="chip${presetOn(p) ? ' on' : ''}" data-p="${i}">${esc(p.name)}</button>`).join('');
}
function applyPreset(i) {
  const p = allPresets()[i]; if (!p) return;
  Object.assign(cfg(), clone(p.cfg)); save(); rebuild(); R.phase = 'idle'; R.sets = 0;
  renderPresets(); render(); if (sheetOpen) buildSheet();
  toast(`${p.name} にしました`);
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* ---------- settings sheet ---------- */
const sheet = $('#sheet'), scrim = $('#scrim');
let sheetOpen = false;
function openSheet() { buildSheet(); sheetOpen = true; sheet.classList.add('open'); scrim.classList.add('open'); sheet.setAttribute('aria-hidden', 'false'); }
function closeSheet() { sheetOpen = false; sheet.classList.remove('open'); scrim.classList.remove('open'); sheet.setAttribute('aria-hidden', 'true'); }
function fmtField(f, v) { return f[6] === 'n' ? String(v) : jp(v); }
function stepper(id, val, attrs) {
  return `<div class="stepper"><button ${attrs} data-d="-1" aria-label="減らす">${ICON.minus}</button><output id="${id}">${val}</output><button ${attrs} data-d="1" aria-label="増やす">${ICON.plus}</button></div>`;
}
function buildSheet() {
  const m = store.mode, c = cfg(), b = busy();
  let h = `<div class="sheet-in"><div class="grab"></div><div class="sheet-head"><h2>${modeName(m)}の設定</h2><button class="done-btn" data-act="close">完了</button></div>`;
  if (m !== 'stopwatch') {
    if (b) h += `<p class="note">タイマーが動いている間は時間を変えられません。リセットすると変えられます。</p>`;
    else {
      h += `<div class="sec"><h3>プリセット</h3><div class="chips">${allPresets().map((p, i) => `<button class="chip${presetOn(p) ? ' on' : ''}" data-p="${i}">${esc(p.name)}</button>`).join('')}</div></div>`;
      h += `<div class="sec"><h3>時間と回数</h3><div class="fields">` + FIELDS[m].map(f =>
        `<div class="field"><span class="lb">${f[1]}${f[5] ? `<span class="hint">${f[5]}</span>` : ''}</span>${stepper('f-' + f[0], fmtField(f, c[f[0]]), `data-f="${f[0]}"`)}</div>`).join('') + `</div></div>`;
      if (m === 'circuit') {
        h += `<div class="sec"><h3>種目（上から順に）</h3><div>` + c.items.map((it, i) =>
          `<div class="item"><input id="item-${i}" data-name="${i}" value="${esc(it.name)}" maxlength="20" aria-label="種目${i + 1}の名前">${stepper('it-' + i, jp(it.dur), `data-it="${i}"`)}<button class="x" data-del="${i}" aria-label="種目${i + 1}を消す" ${c.items.length <= 1 ? 'disabled' : ''}>${ICON.x}</button></div>`).join('') +
          `</div>${c.items.length < 12 ? '<button class="wide" data-act="add">＋ 種目を追加</button>' : ''}</div>`;
      }
      const mine = store.custom[m] || [];
      h += `<div class="sec"><h3>マイプリセット</h3>` +
        (mine.length ? `<div class="chips">${mine.map((p, i) => `<span class="my"><button class="chip" data-p="${PRESETS[m].length + i}">${esc(p.name)}</button><button class="x" data-mydel="${i}" aria-label="${esc(p.name)}を消す">${ICON.x}</button></span>`).join('')}</div>` : '<p class="note">よく使う設定を保存すると、ホーム画面の下にボタンが出ます。</p>') +
        (mine.length < 6 ? `<button class="wide" data-act="savepreset">今の設定を保存（${esc(summary(m, c))}）</button>` : '') + `</div>`;
    }
  }
  const tg = (k, label, hint) => `<div class="toggle"><span class="lb">${label}<span class="hint">${hint}</span></span><button class="sw" role="switch" data-pref="${k}" aria-checked="${!!store.prefs[k]}" aria-label="${label}"></button></div>`;
  h += `<div class="sec"><h3>合図</h3><div>` +
    tg('sound', '音', '切り替えと残り3秒で鳴ります。iPhone はマナーモード中だと鳴りません') +
    tg('voice', '声で知らせる', '「休憩」「ラスト」や種目名を読み上げます') +
    tg('vibrate', '振動', 'Android のみ対応') +
    `</div><button class="wide" data-act="test">音を試す</button></div></div>`;
  sheet.innerHTML = h;
}
function changeField(k, d) {
  const f = FIELDS[store.mode].find(x => x[0] === k), c = cfg();
  c[k] = clamp(c[k] + d * f[4], f[2], f[3]);
  if (store.mode === 'countdown' && c.min === 0 && c.sec === 0) c.sec = 5;
  save(); rebuild();
  const out = $('#f-' + k); if (out) out.textContent = fmtField(f, c[k]);
  if (store.mode === 'countdown') { const s = $('#f-sec'); if (s) s.textContent = String(c.sec); }
  refreshChips(); render();
}
function changeItem(i, d) {
  const it = cfg().items[i]; it.dur = clamp(it.dur + d * 5, 5, 300);
  save(); rebuild(); const out = $('#it-' + i); if (out) out.textContent = jp(it.dur); refreshChips(); render();
}
function refreshChips() {
  sheet.querySelectorAll('.chip[data-p]').forEach(el => el.classList.toggle('on', presetOn(allPresets()[+el.dataset.p])));
  renderPresets();
}

// press-and-hold repeat for steppers
let holdT = 0, holdI = 0;
function stopHold() { clearTimeout(holdT); clearInterval(holdI); }
sheet.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-d]'); if (!b) return;
  e.preventDefault();
  const d = +b.dataset.d, run = () => b.dataset.f ? changeField(b.dataset.f, d) : changeItem(+b.dataset.it, d);
  run(); stopHold();
  holdT = setTimeout(() => { holdI = setInterval(run, 70); }, 380);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => sheet.addEventListener(t, stopHold));
sheet.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || t.dataset.d) return;
  const m = store.mode, c = cfg();
  if (t.dataset.p != null) return applyPreset(+t.dataset.p);
  if (t.dataset.pref) { store.prefs[t.dataset.pref] = !store.prefs[t.dataset.pref]; t.setAttribute('aria-checked', store.prefs[t.dataset.pref]); save(); audio(); return; }
  if (t.dataset.del != null) { c.items.splice(+t.dataset.del, 1); save(); rebuild(); buildSheet(); renderPresets(); render(); return; }
  if (t.dataset.mydel != null) { store.custom[m].splice(+t.dataset.mydel, 1); save(); buildSheet(); renderPresets(); render(); return; }
  const act = t.dataset.act;
  if (act === 'close') closeSheet();
  else if (act === 'add') { c.items.push({ name: `種目${c.items.length + 1}`, dur: 30 }); save(); rebuild(); buildSheet(); render(); const inp = $('#item-' + (c.items.length - 1)); if (inp) inp.focus(); }
  else if (act === 'savepreset') { (store.custom[m] = store.custom[m] || []).push({ name: summary(m, c), cfg: clone(c) }); save(); buildSheet(); renderPresets(); render(); toast('マイプリセットに保存しました'); }
  else if (act === 'test') { audio(); const was = store.prefs.sound; store.prefs.sound = true; play('go'); store.prefs.sound = was; buzz([120, 60, 120]); say('休憩'); }
});
sheet.addEventListener('input', e => {
  const i = e.target.dataset.name; if (i == null) return;
  cfg().items[+i].name = e.target.value.trim(); save(); rebuild(); render();
});
scrim.addEventListener('click', closeSheet);

/* ---------- events ---------- */
$('#gear').addEventListener('click', openSheet);
$('#tabs').addEventListener('click', e => { const t = e.target.closest('[data-m]'); if (t) switchMode(t.dataset.m); });
presetsEl.addEventListener('click', e => { const t = e.target.closest('[data-p]'); if (t) applyPreset(+t.dataset.p); });
ctlEl.addEventListener('click', e => { const t = e.target.closest('[data-k]'); if (t && !t.disabled) { const b = ctlFns[t.dataset.k]; if (b && b.fn) b.fn(); } });
function stageAction() { const c = ctlFns.c || controls().c; if (c.fn && !c.noStage && !c.dis) c.fn(); }
stage.addEventListener('click', stageAction);
document.addEventListener('keydown', e => {
  if (sheetOpen) { if (e.key === 'Escape') closeSheet(); return; }
  if (e.key === ' ' || e.key === 'Enter') { if (e.target.closest && e.target.closest('button,input')) return; e.preventDefault(); stageAction(); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (isActive()) wake(true); logic(); render(); } });

function frame() { logic(); render(); requestAnimationFrame(frame); }
setInterval(logic, 250); // keeps phases advancing when animation frames are throttled

rebuild(); renderTabs(); renderPresets(); render(); requestAnimationFrame(frame);

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}
})();
</script>
</body>
</html>
